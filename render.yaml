# Always-on deployment for the appointment portal and telephone receptionist.
# Review Render's charges before creating this Blueprint.
databases:
  - name: proactivecare-partha81-db
    plan: 0.1c-256mb
    region: singapore
    databaseName: proactivecare

services:
  - type: web
    name: proactivecare-partha81-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proactivecare-partha81-db
          property: connectionString
      - key: SERVICE_TOKEN
        generateValue: true
      - key: STAFF_ADMIN_EMAIL
        sync: false
      - key: STAFF_ADMIN_PASSWORD
        sync: false
      - key: HOSPITAL_TIMEZONE
        value: Asia/Kolkata
      - key: AI_SERVICE_URL
        value: https://proactivecare-partha81-voice.onrender.com
      - key: CORS_ORIGINS
        value: https://proactivecare-partha81-web.onrender.com

  - type: web
    name: proactivecare-partha81-voice
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: ai_notification_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: BACKEND_BASE_URL
        value: https://proactivecare-partha81-api.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://proactivecare-partha81-voice.onrender.com
      - key: CORS_ORIGINS
        value: https://proactivecare-partha81-web.onrender.com
      - key: SERVICE_TOKEN
        fromService:
          name: proactivecare-partha81-api
          type: web
          envVarKey: SERVICE_TOKEN
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  - type: web
    name: proactivecare-partha81-web
    runtime: static
    rootDir: mediconnect-ai
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.0.0
      - key: VITE_API_BASE_URL
        value: https://proactivecare-partha81-api.onrender.com/api
      - key: VITE_VOICE_BASE_URL
        value: https://proactivecare-partha81-voice.onrender.com
